<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Transform & Animation</h1>

    <div class="container">
        <!-- 1. Hover Scale & Rotate Transform -->
        <div class="card">
            <h3>Hover Scale & Rotate</h3>
            <img src="cat.jpeg" alt="Cat" class="img-hover-transform">
        </div>

        <!-- 2. Continuous Spin Animation -->
        <div class="card">
            <h3>Spin Animation</h3>
            <img src="cat.jpeg" alt="Cat" class="img-spin">
        </div>

        <!-- 3. Bounce / Floating Animation -->
        <div class="card">
            <h3>Bounce Animation</h3>
            <img src="cat.jpeg" alt="Cat" class="img-bounce">
        </div>
    </div>

</body>

</html>
