<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Layout</title>
</head>

<body>
    <header>
        <h1>this is header section</h1>
        <a href="/home">home</a>
        <a href="pages/about.html">About us</a>
        <a href="https://facebook.com" target="_blank">My FB</a>
        <a href="wholetomato.exe">Download Whole Tomato</a>
    </header>
    
    <main>
        <h1>this is main section</h1>
        <!-- A page section -->
        <section>
            <!-- A self-contained content -->
            <article>
                <!-- Content goes here -->
                <div>
                    I am a content inside div
                </div>
                <div>
                    I am another div
                </div>

                <span>
                    I am a content inside span
                </span>
                <span>
                    I am another span
                </span>
            </article>
        </section>
        <!-- Content aside from the main content (e.g. Ads, sidebars) -->
        <aside>
            <!-- Aside content goes here -->
        </aside>
    </main>

    <footer>
        <h1>this is footer section</h1>
    </footer>
</body>

</html>
