<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>using hr, br, and span</title>
</head>
<body>
    <h1>using hr, br, and span</h1>
    <p>This is a paragraph with a line break.<br>This is the second line.</p>
    <hr>
    <p>This is another paragraph.</p>
    <hr>
    <p>This is the final paragraph.</p>
    <span >This is a span text.</span>
    <span >This is another span text.</span>
</body>
</html>
